name: scout

on:
  schedule:
    - cron: "0 4 * * 3,0"
  workflow_dispatch:
    inputs:
      dry:
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    if: vars.DOCTOR_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scout for better free tools
        env:
          GH_TOKEN: ${{ github.token }}
          DOCTOR_GEMINI_API_KEY: ${{ secrets.DOCTOR_GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY: ${{ inputs.dry }}
        run: |
          if [ "$DRY" = "true" ]; then python -m doctor scout --dry; else python -m doctor scout; fi
